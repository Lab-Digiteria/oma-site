# OMA Oficina — trechos para o vhost do CloudPanel (Sites > omaoficina.com.br > Vhost).
# Cole DENTRO do bloco "server { ... }" do HTTPS, antes do "location /".

# ---------- Cache e compressão ----------
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
location ~* ^/(_astro|img)/ {
  expires 1y;
  add_header Cache-Control "public, max-age=31536000, immutable";
  try_files $uri =404;
}
location ~* \.(avif|webp|png|jpg|svg|woff2)$ {
  expires 30d;
  add_header Cache-Control "public, max-age=2592000";
}

# ---------- Segurança básica ----------
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;

# ---------- Redirecionamentos 301 do site antigo (WordPress) ----------
# Páginas institucionais -> âncoras da página nova
location = /servicos/            { return 301 /#servicos; }
location = /servicos             { return 301 /#servicos; }
location = /sobre-nos/           { return 301 /#estrutura; }
location = /conheca-a-oma/       { return 301 /#estrutura; }
location = /contatos/            { return 301 /#agendar; }
location = /contatos             { return 301 /#agendar; }
location = /como-chegar/         { return 301 /#contato; }
location = /sustentabilidade/    { return 301 /#sustentabilidade; }
location = /nossas-dicas/        { return 301 /#perguntas; }
location = /oficina-mecanica-especializa-em-porsche-no-rio-de-janeiro/ { return 301 /#servicos; }
location ^~ /portfolio-item/     { return 301 /; }
location ^~ /category/           { return 301 /; }
location ^~ /author/             { return 301 /; }
location ^~ /wp-content/         { return 410; }
location ^~ /wp-admin            { return 410; }
location = /wp-login.php         { return 410; }
location ~ ^/[a-z-]*sitemap[0-9]*\.xml$ { return 301 /sitemap-index.xml; }

